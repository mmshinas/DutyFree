function downloadFlightReport(meta, log, stockRows, payments, preorderStockRows){
  const area = document.getElementById('reportPrintArea');
  area.innerHTML = buildReportHtml(meta, log, stockRows, payments, preorderStockRows);
  window.print();
}

const PAYMENT_METHOD_LABELS = { card: 'Credit Card', voucher: 'Onboard Vouchers', cash: 'Cash', mix: 'Mix' };

function renderPayment(main){
  const total = cartTotal();
  const method = state.paymentMethod;
  const cashDiscount = method === 'cash' ? cashDiscountUSD() : 0;
  const due = saleDueTotal(method);
  const collected = paymentLinesTotalUSD();
  const remaining = due - collected;
  const fullyCovered = method && (method === 'card' || method === 'voucher' || remaining <= 0.005);

  let html = `
    <div class="list-title">Payment</div>
    <div class="list-count">Total due: ${fmt(due)}</div>
    <div class="section-label" style="margin-top:16px;">Method of Payment</div>
    <div class="payment-method-grid">
      <button class="payment-method-btn${method==='card'?' selected':''}" data-method="card" type="button">Credit Card</button>
      <button class="payment-method-btn${method==='voucher'?' selected':''}" data-method="voucher" type="button">Onboard Vouchers</button>
      <button class="payment-method-btn${method==='cash'?' selected':''}" data-method="cash" type="button">Cash</button>
      <button class="payment-method-btn${method==='mix'?' selected':''}" data-method="mix" type="button">Mix</button>
    </div>
  `;

  if(cashDiscount > 0){
    html += `
      <div class="price-panel" style="margin-top:6px;">
        <div class="price-line"><div class="lbl">Cart total</div><div class="val">${fmt(total)}</div></div>
        <div class="price-line special"><div class="lbl">Cash discount</div><div class="val">−${fmt(cashDiscount)}</div></div>
        <div class="price-line"><div class="lbl"><b>Total due (Cash)</b></div><div class="val"><b>${fmt(due)}</b></div></div>
      </div>
    `;
  }

  if(method === 'card' || method === 'voucher'){
    html += `
      <div class="price-panel" style="margin-top:6px;">
        <div class="price-line"><div class="lbl">Settled via ${escapeHtml(PAYMENT_METHOD_LABELS[method])}</div><div class="val">${fmt(due)}</div></div>
      </div>
      <div class="stock-note">The full amount will be recorded as settled via ${escapeHtml(PAYMENT_METHOD_LABELS[method])}.</div>
    `;
  } else if(method === 'cash' || method === 'mix'){
    html += `
      <div class="section-label" style="margin-top:16px;">Add Payment</div>
      <div class="payment-line-form">
        ${method === 'mix' ? `
        <select id="lineMethodSelect" class="payment-select">
          <option value="cash">Cash</option>
          <option value="card">Credit Card</option>
          <option value="voucher">Onboard Voucher</option>
        </select>` : ''}
        <select id="lineCurrencySelect" class="payment-select" style="display:${method==='cash' ? 'block':'none'};">
          <option value="USD">USD</option>
          ${CONVERSION_RATES.rates.map(r => `<option value="${escapeAttr(r.code)}">${escapeHtml(r.code)}</option>`).join('')}
        </select>
        <input type="number" id="lineAmountInput" class="payment-amount-input" placeholder="Amount" inputmode="decimal" min="0" step="0.01">
        <button class="payment-add-btn" id="addLineBtn" type="button">Add</button>
      </div>
      <div class="stock-note" id="amountDueHint" style="margin:0 0 4px;"></div>
      <div class="payment-lines-list">
        ${state.paymentLines.length === 0
          ? '<div class="empty-state" style="padding:16px 4px;">No payment lines added yet.</div>'
          : state.paymentLines.map((l, idx) => `
            <div class="payment-line-row">
              <div class="payment-line-info">
                <div class="payment-line-method mono">${escapeHtml(PAYMENT_METHOD_LABELS[l.method])}${l.method==='cash' ? ` · ${escapeHtml(l.currency)} ${l.amountForeign.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}` : ''}</div>
              </div>
              <div class="payment-line-amt mono">${fmt(l.amountUSD)}</div>
              <button class="payment-line-remove" data-idx="${idx}" type="button" aria-label="Remove">×</button>
            </div>
          `).join('')
        }
      </div>
      <div class="session-subtotal" style="margin-top:10px;"><span>Collected</span><span class="mono">${fmt(collected)}</span></div>
      <div class="session-subtotal"><span>${remaining > 0 ? 'Remaining' : 'Change / Overage'}</span><span class="mono">${fmt(Math.abs(remaining))}</span></div>
    `;
  } else {
    html += `<div class="stock-note" style="margin-top:6px;">Select a method of payment above to continue.</div>`;
  }

  html += `
    <div class="cart-footer">
      <button class="add-cart-btn" id="cancelPaymentBtn" type="button" style="background:var(--paper-raised); color:var(--ink); border:1px solid var(--hairline); margin-bottom:8px;">‹ Back to Cart</button>
      <button class="add-cart-btn" id="confirmPaymentBtn" type="button" ${fullyCovered ? '' : 'disabled'}>Confirm & Complete Sale</button>
    </div>
  `;

  main.innerHTML = html;

  main.querySelectorAll('.payment-method-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.method;
      state.paymentMethod = m;
      if(m === 'card' || m === 'voucher'){
        state.paymentLines = [{ method: m, currency: 'USD', amountForeign: total, amountUSD: total }];
      } else {
        state.paymentLines = [];
      }
      renderPayment(main);
    });
  });

  const lineMethodSelect = document.getElementById('lineMethodSelect');
  const lineCurrencySelect = document.getElementById('lineCurrencySelect');
  const lineAmountInput = document.getElementById('lineAmountInput');
  const amountDueHint = document.getElementById('amountDueHint');

  function updateAmountDefault(){
    if(!lineAmountInput) return;
    const remainingNow = Math.max(0, due - paymentLinesTotalUSD());
    const currentMethod = lineMethodSelect ? lineMethodSelect.value : 'cash';
    let dueForeign = remainingNow;
    let currencyLabel = 'USD';
    if(currentMethod === 'cash' && lineCurrencySelect){
      currencyLabel = lineCurrencySelect.value;
      const rate = getCurrencyRate(currencyLabel);
      dueForeign = currencyLabel === 'USD' ? remainingNow : remainingNow * rate;
    }
    lineAmountInput.value = dueForeign.toFixed(2);
    lineAmountInput.focus();
    lineAmountInput.select();
    if(amountDueHint){
      amountDueHint.textContent = remainingNow > 0.005
        ? `To settle the balance: ${dueForeign.toFixed(2)} ${currencyLabel}`
        : 'Balance already covered.';
    }
  }
  updateAmountDefault();

  if(lineMethodSelect){
    lineMethodSelect.addEventListener('change', () => {
      lineCurrencySelect.style.display = lineMethodSelect.value === 'cash' ? 'block' : 'none';
      updateAmountDefault();
    });
  }
  lineCurrencySelect?.addEventListener('change', updateAmountDefault);

  document.getElementById('addLineBtn')?.addEventListener('click', () => {
    const lineMethod = lineMethodSelect ? lineMethodSelect.value : 'cash';
    const amountInput = document.getElementById('lineAmountInput');
    const amountForeign = parseFloat(amountInput.value);
    if(!amountForeign || amountForeign <= 0){
      showToast('Enter a valid amount');
      return;
    }
    let currency = 'USD';
    let amountUSD = amountForeign;
    if(lineMethod === 'cash'){
      currency = lineCurrencySelect.value;
      const rate = getCurrencyRate(currency);
      amountUSD = currency === 'USD' ? amountForeign : amountForeign / rate;
    }
    state.paymentLines.push({ method: lineMethod, currency, amountForeign, amountUSD });
    renderPayment(main);
  });

  main.querySelectorAll('.payment-line-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      state.paymentLines.splice(Number(btn.dataset.idx), 1);
      renderPayment(main);
    });
  });

  document.getElementById('cancelPaymentBtn').addEventListener('click', () => {
    state.paymentMethod = null;
    state.paymentLines = [];
    state.view = 'cart';
    window.scrollTo(0,0);
    render();
  });

  document.getElementById('confirmPaymentBtn').addEventListener('click', () => {
    if(!fullyCovered) return;
    showConfirm(`Complete sale for ${fmt(due)} via ${PAYMENT_METHOD_LABELS[state.paymentMethod]}? This will update stock levels.`, () => {
      finalizeSale();
    });
  });
}

let expandedRefundKey = null;
function refundGroupKey(i){
  const staffKey = i.priceLabel === 'Crew' ? (i.crewStaffNo||'') + '|' + (i.crewStaffName||'') : '';
  const preKey = i.fromPreorder ? 'pre' : 'reg';
  return i.itemCode + '|' + i.priceLabel + '|' + staffKey + '|' + preKey;
}
function refundSaleGroup(itemCode, priceLabel, crewStaffNo, crewStaffName, fromPreorder, refundQty){
  const log = loadSalesLog();
  const staffKey = priceLabel === 'Crew' ? (crewStaffNo||'') + '|' + (crewStaffName||'') : '';
  const preKey = fromPreorder ? 'pre' : 'reg';
  let remaining = refundQty;
  const newLog = [];
  log.forEach(l => {
    const lStaffKey = l.priceLabel === 'Crew' ? (l.crewStaffNo||'') + '|' + (l.crewStaffName||'') : '';
    const lPreKey = l.fromPreorder ? 'pre' : 'reg';
    const matches = l.itemCode === itemCode && l.priceLabel === priceLabel && lStaffKey === staffKey && lPreKey === preKey;
    if(matches && remaining > 0){
      if(l.qty <= remaining){
        remaining -= l.qty;
        return; // this line fully refunded — drop it
      } else {
        const newQty = l.qty - remaining;
        newLog.push(Object.assign({}, l, { qty: newQty, lineTotal: newQty * l.unitPrice }));
        remaining = 0;
        return;
      }
    }
    newLog.push(l);
  });
  saveSalesLog(newLog);
  if(fromPreorder){
    addPreorderStock(itemCode, refundQty);
  } else {
    setStock(itemCode, getStock(itemCode) + refundQty);
  }
}

function renderSessionSummary(main){
  const log = loadSalesLog();
  const flightInfo = getFlightInfo();
  const {
    passengerItems, crewItems, preorderPassengerItems, preorderCrewItems,
    passengerTotal, crewTotal, preorderPassengerTotal, preorderCrewTotal, grandTotal
  } = computeSummaryTotals(log);

  function sectionRows(items){
    if(items.length === 0){
      return '<div class="empty-state" style="padding:16px 4px;">No items in this section yet.</div>';
    }
    return items.map(i => {
      const key = refundGroupKey(i);
      const expanded = expandedRefundKey === key;
      return `
      <div class="session-row">
        <div class="session-row-mid">
          <div class="item-name">${escapeHtml(i.name)}</div>
          <div class="item-code mono">${escapeHtml(i.itemCode)} · ${fmt(i.unitPrice)} × ${i.qty}${i.priceLabel === 'Crew' ? ` · ${escapeHtml(i.crewStaffNo || '—')} ${escapeHtml(i.crewStaffName || '—')}` : ''}</div>
          <span class="session-tag">${escapeHtml(displayPriceLabel(i.priceLabel))}</span>
        </div>
        <div class="item-price">
          <div class="amt">${fmt(i.lineTotal)}</div>
          ${expanded ? `
            <div class="refund-form">
              <input type="number" class="flight-input refund-qty-input" min="1" max="${i.qty}" step="1" value="${i.qty}">
              <button class="refund-confirm-btn" type="button"
                data-code="${escapeAttr(i.itemCode)}" data-label="${escapeAttr(i.priceLabel)}"
                data-staffno="${escapeAttr(i.crewStaffNo||'')}" data-staffname="${escapeAttr(i.crewStaffName||'')}"
                data-preorder="${i.fromPreorder ? '1' : '0'}">Confirm Refund</button>
              <button class="refund-cancel-btn" type="button">Cancel</button>
            </div>
          ` : `<button class="refund-toggle-btn" type="button" data-key="${escapeAttr(key)}">Refund</button>`}
        </div>
      </div>`;
    }).join('');
  }

  let html = `
    <div class="list-title">Current Flight Summary</div>
    <div class="list-count">${flightInfo.number || flightInfo.date ? `${escapeHtml(flightInfo.number || 'Flight —')}${flightInfo.date ? ' · ' + escapeHtml(flightInfo.date) : ''} · ` : ''}${log.length === 0 ? 'No sales recorded on this flight yet' : `${log.length} sale line${log.length===1?'':'s'} recorded`}</div>
  `;

  const flightOpenNow = isFlightOpen();
  html += `
    <div class="section-label" style="margin-top:20px;">Normal Sales to Passengers</div>
    ${sectionRows(passengerItems)}
    <div class="session-subtotal"><span>Subtotal</span><span class="mono">${fmt(passengerTotal)}</span></div>

    <div class="section-label" style="margin-top:20px;">Normal Sales to Staff</div>
    ${sectionRows(crewItems)}
    <div class="session-subtotal"><span>Subtotal</span><span class="mono">${fmt(crewTotal)}</span></div>

    <div class="section-label" style="margin-top:20px;">Pre-order to Passengers</div>
    ${sectionRows(preorderPassengerItems)}
    <div class="session-subtotal"><span>Subtotal</span><span class="mono">${fmt(preorderPassengerTotal)}</span></div>

    <div class="section-label" style="margin-top:20px;">Pre-orders to Staff</div>
    ${sectionRows(preorderCrewItems)}
    <div class="session-subtotal"><span>Subtotal</span><span class="mono">${fmt(preorderCrewTotal)}</span></div>

    <div class="cart-footer">
      <div class="cart-total-line"><span>Grand Total</span><span class="mono">${fmt(grandTotal)}</span></div>
      <button class="report-download-btn" id="downloadReportBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        Download Report (PDF)
      </button>
      ${flightOpenNow
        ? `<button class="add-cart-btn" id="closeSessionBtn" type="button">Close Flight</button>`
        : `<button class="add-cart-btn" type="button" disabled>Close Flight</button>
           <div class="stock-note" style="text-align:center; margin-top:8px;">Open a flight (full flight details + opening stock) to enable closing.</div>`
      }
    </div>
  `;

  html += floatingHomeBarHtml();
  main.innerHTML = html;

  wireFloatingHomeBar();
  document.getElementById('floatingHomeBtn')?.addEventListener('click', () => { expandedRefundKey = null; });

  main.querySelectorAll('.refund-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      expandedRefundKey = btn.dataset.key;
      renderSessionSummary(main);
    });
  });
  main.querySelectorAll('.refund-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      expandedRefundKey = null;
      renderSessionSummary(main);
    });
  });
  main.querySelectorAll('.refund-confirm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('.session-row');
      const qtyInput = row.querySelector('.refund-qty-input');
      const qty = parseInt(qtyInput.value, 10) || 0;
      const maxQty = parseInt(qtyInput.max, 10) || 0;
      if(qty <= 0){
        showToast('Enter a quantity to refund');
        return;
      }
      if(qty > maxQty){
        showToast(`Cannot refund more than ${maxQty} units`);
        return;
      }
      const itemCode = btn.dataset.code;
      const priceLabel = btn.dataset.label;
      const staffNo = btn.dataset.staffno;
      const staffName = btn.dataset.staffname;
      const fromPreorder = btn.dataset.preorder === '1';
      showConfirm(`Refund ${qty} unit${qty===1?'':'s'}? This removes it from sales and adds it back to ${fromPreorder ? 'the pre-order balance' : 'stock'}.`, () => {
        refundSaleGroup(itemCode, priceLabel, staffNo, staffName, fromPreorder, qty);
        expandedRefundKey = null;
        showToast('Refund processed — stock updated');
        renderSessionSummary(main);
      });
    });
  });

  document.getElementById('downloadReportBtn')?.addEventListener('click', () => {
    downloadFlightReport(
      { flightNumber: flightInfo.number, flightDate: flightInfo.date, sector: flightInfo.sector, staffNo: flightInfo.staffNo, staffName: flightInfo.staffName },
      log,
      buildStockReportRows(log),
      loadPaymentsLog(),
      buildPreorderStockReportRows(log)
    );
  });

  const closeBtn = document.getElementById('closeSessionBtn');
  if(closeBtn){
    closeBtn.addEventListener('click', () => {
      showConfirm('Close this flight? The summary will be archived, the sales log cleared, and opening stock reset to 0 for the next flight.', () => {
        const archived = {
          id: Date.now(), closedAt: Date.now(),
          flightDate: flightInfo.date, flightNumber: flightInfo.number,
          sector: flightInfo.sector, staffNo: flightInfo.staffNo, staffName: flightInfo.staffName,
          lines: log, passengerTotal, crewTotal, grandTotal,
          stockReport: buildStockReportRows(log),
          preorderStockReport: buildPreorderStockReportRows(log),
          payments: loadPaymentsLog()
        };
        const hist = loadSessionsHistory();
        hist.push(archived);
        saveSessionsHistory(hist);
        saveSalesLog([]);
        savePaymentsLog([]);
        resetAllStock();
        clearAllOpeningStockSnapshots();
        clearConfirmedCategories();
        clearPreOrders();
        preorderCartDrafts = {};
        expandedRefundKey = null;
        clearFlightInfo();
        showToast('Flight closed — ready to open the next flight');
        state.view = 'home';
        window.scrollTo(0,0);
        render();
      });
    });
  }
}

function renderFlightHistory(main){
  const history = loadSessionsHistory();

  let html = `
    <div class="list-title">Flight Sales History</div>
    <div class="list-count">${history.length === 0 ? 'No closed flights recorded yet' : `${history.length} closed flight${history.length===1?'':'s'} on record`}</div>
  `;

  if(history.length === 0){
    html += '<div class="empty-state">Once a flight is closed, its sales summary and report will appear here.</div>';
  } else {
    html += history.slice().reverse().map(s => `
      <div class="archive-card">
        <div class="archive-card-header">
          <div class="archive-card-title">${s.flightNumber ? escapeHtml(s.flightNumber) : 'Flight —'}</div>
          <div class="archive-card-total">${fmt(s.grandTotal)}</div>
        </div>
        <div class="archive-card-meta">${s.flightDate ? escapeHtml(s.flightDate) + ' · ' : ''}Closed ${new Date(s.closedAt).toLocaleString()}</div>
        <div class="archive-card-stats mono">${s.lines.length} line${s.lines.length===1?'':'s'} · Passenger ${fmt(s.passengerTotal)} · Staff ${fmt(s.crewTotal)}</div>
        <div class="archive-actions">
          <button class="archive-btn" type="button" data-archive-id="${s.id}" data-action="report">Download Report</button>
          <button class="archive-btn danger" type="button" data-archive-id="${s.id}" data-action="delete">Delete</button>
        </div>
      </div>
    `).join('');
  }

  html += floatingHomeBarHtml();
  main.innerHTML = html;

  wireFloatingHomeBar();

  main.querySelectorAll('.archive-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const archived = history.find(s => String(s.id) === btn.dataset.archiveId);
      if(!archived) return;

      if(btn.dataset.action === 'report'){
        downloadFlightReport(
          { flightNumber: archived.flightNumber, flightDate: archived.flightDate, closedAt: archived.closedAt, sector: archived.sector, staffNo: archived.staffNo, staffName: archived.staffName },
          archived.lines,
          archived.stockReport || [],
          archived.payments || [],
          archived.preorderStockReport || []
        );
      } else if(btn.dataset.action === 'delete'){
        const label = archived.flightNumber || archived.flightDate || new Date(archived.closedAt).toLocaleDateString();
        showConfirm(`Delete the archived record for ${label}? This cannot be undone.`, () => {
          const updated = loadSessionsHistory().filter(s => s.id !== archived.id);
          saveSessionsHistory(updated);
          showToast('Archived flight record deleted');
          renderFlightHistory(main);
        });
      }
    });
  });
}

function formatOrdinalDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  const month = d.toLocaleString('en-US', { month: 'long' });
  const year = d.getFullYear();
  const suffix = (day % 10 === 1 && day !== 11) ? 'st'
    : (day % 10 === 2 && day !== 12) ? 'nd'
    : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
  return `${day}${suffix} ${month} ${year}`;
}
function formatShortDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getDate()} ${d.toLocaleString('en-US', { month: 'short' })}`;
}
function conversionRatesValidityLabel(){
  const from = formatShortDate(CONVERSION_RATES.effectiveFrom);
  const to = formatShortDate(CONVERSION_RATES.effectiveTo);
  const year = new Date(CONVERSION_RATES.effectiveTo + 'T00:00:00').getFullYear();
  return `${from} – ${to} ${year}`;
}

function openSheet(it){
  currentSheetItem = it;
  const sheet = document.getElementById('sheet');
  const img = getItemImage(it);
  const thumbHtml = img
    ? `<img src="${img}" alt="${escapeAttr(it.name)}">`
    : GENERIC_PHOTO_ICON;
  const crewPrice = getCrewPrice(it);

  let priceLines = `
    <div class="price-line">
      <div class="lbl">Listed price</div>
      <div class="val-col">
        <div class="val" data-usd="${it.listedPrice}">${fmt(it.listedPrice)}</div>
        <div class="val-converted" data-usd="${it.listedPrice}"></div>
      </div>
    </div>`;
  if(it.specialPrice !== undefined){
    priceLines += `
      <div class="price-line special">
        <div class="lbl">Onboard passenger special</div>
        <div class="val-col">
          <div class="val" data-usd="${it.specialPrice}">${fmt(it.specialPrice)}</div>
          <div class="val-converted" data-usd="${it.specialPrice}"></div>
        </div>
      </div>`;
  }
  if(crewPrice !== it.listedPrice){
    priceLines += `
      <div class="price-line special">
        <div class="lbl">Staff price</div>
        <div class="val-col">
          <div class="val" data-usd="${crewPrice}">${fmt(crewPrice)}</div>
          <div class="val-converted" data-usd="${crewPrice}"></div>
        </div>
      </div>`;
  }

  const stock = getStock(it.itemCode);
  const avail = availableStock(it.itemCode);
  const flightIsOpen = isFlightOpen();
  const stockLineText = !flightIsOpen
    ? 'Open a flight (full flight details + opening stock) before selling'
    : (avail === 0 ? 'Out of stock' : `${avail} in stock`);

  const txType = cartTransactionType();
  const hasSpecial = it.specialPrice !== undefined;
  const lockPassengerOpts = txType === 'crew';
  const lockCrewOpt = txType === 'passenger';
  const lockListedOpt = lockPassengerOpts || hasSpecial;
  const listedSelected = !lockListedOpt;
  const specialSelected = hasSpecial && !lockPassengerOpts;
  const crewSelected = txType === 'crew';

  let priceChoiceHtml = `
    <div class="price-choice">
      <label class="price-opt${lockListedOpt ? ' disabled' : (listedSelected ? ' selected' : '')}" data-value="listed">
        <input type="radio" name="priceChoice" value="listed" ${lockListedOpt ? 'disabled' : ''} ${listedSelected ? 'checked' : ''}>
        <span>Listed<b>${fmt(it.listedPrice)}</b></span>
      </label>`;
  if(it.specialPrice !== undefined){
    priceChoiceHtml += `
      <label class="price-opt${lockPassengerOpts ? ' disabled' : (specialSelected ? ' selected' : '')}" data-value="special">
        <input type="radio" name="priceChoice" value="special" ${lockPassengerOpts ? 'disabled' : ''} ${specialSelected ? 'checked' : ''}>
        <span>Special<b>${fmt(it.specialPrice)}</b></span>
      </label>`;
  }
  priceChoiceHtml += `
      <label class="price-opt${lockCrewOpt ? ' disabled' : (crewSelected ? ' selected' : '')}" data-value="crew">
        <input type="radio" name="priceChoice" value="crew" ${lockCrewOpt ? 'disabled' : ''} ${crewSelected ? 'checked' : ''}>
        <span>Staff<b>${fmt(crewPrice)}</b></span>
      </label>
    </div>`;
  if(txType){
    priceChoiceHtml += `<div class="tx-lock-note">Cart already has ${txType === 'crew' ? 'staff' : txType} sales — clear or complete it to switch price tiers.</div>`;
  }

  const maxAttr = ` max="${avail}"`;
  const isBlocked = !flightIsOpen || avail === 0;
  const disabledAttr = isBlocked ? 'disabled' : '';
  const startQty = isBlocked ? 0 : 1;
  const addBtnLabel = !flightIsOpen ? 'Open a Flight to Sell' : (avail === 0 ? 'Out of Stock' : 'Add to Cart');
  const salePanelHtml = `
    <div class="sale-panel">
      <div class="stock-line${isBlocked ? ' out-of-stock' : ''}">${stockLineText}</div>
      ${priceChoiceHtml}
      <div class="qty-stepper">
        <button class="qty-btn" type="button" id="qtyDec" ${disabledAttr}>−</button>
        <input type="number" class="qty-input" id="qtyInput" value="${startQty}" min="1"${maxAttr} ${disabledAttr}>
        <button class="qty-btn" type="button" id="qtyInc" ${disabledAttr}>+</button>
      </div>
      <button class="add-cart-btn" id="addCartBtn" type="button" ${disabledAttr}>${addBtnLabel}</button>
    </div>
  `;

  sheet.innerHTML = `
    <div class="sheet-sticky-bar"><button class="close-btn" id="closeSheet">×</button></div>
    <div class="sheet-handle"></div>
    <div class="sheet-thumb" id="sheetThumb">${thumbHtml}</div>
    <div class="sheet-eyebrow">${escapeHtml(catLabel(it.category))} · Item ${String(it.itemNo).padStart(2,'0')} · <span class="mono">${escapeHtml(it.itemCode)}</span></div>
    <div class="sheet-name">${escapeHtml(it.name)}</div>
    <div class="sheet-desc">${escapeHtml(it.description || 'No further description available for this item.')}</div>
    <div class="price-currency-row">
      <label class="flight-label" for="itemCurrencySelect">Show price in</label>
      <select id="itemCurrencySelect" class="payment-select">
        <option value="USD"${selectedDisplayCurrency==='USD' ? ' selected' : ''}>USD (original)</option>
        ${CONVERSION_RATES.rates.map(r => `<option value="${escapeAttr(r.code)}"${selectedDisplayCurrency===r.code ? ' selected' : ''}>${escapeHtml(r.code)}</option>`).join('')}
      </select>
    </div>
    <div class="price-panel">${priceLines}</div>
    ${CASH_DISCOUNT_ITEMS.has(it.itemNo) ? `<div class="stock-note" style="margin-top:6px;">💵 Passengers get a further USD ${CASH_DISCOUNT_USD} off this item when the sale is paid 100% in Cash at checkout.</div>` : ''}
    ${salePanelHtml}
  `;
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  updateSheetPriceConversion();
  document.getElementById('itemCurrencySelect').addEventListener('change', (e) => {
    selectedDisplayCurrency = e.target.value;
    updateSheetPriceConversion();
  });
  sheet.querySelectorAll('.price-opt').forEach(label => {
    label.addEventListener('click', () => {
      if(label.classList.contains('disabled')) return;
      sheet.querySelectorAll('.price-opt').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
    });
  });
  const qtyInput = document.getElementById('qtyInput');
  document.getElementById('qtyDec')?.addEventListener('click', () => {
    let v = parseInt(qtyInput.value, 10) || 1;
    qtyInput.value = Math.max(1, v - 1);
  });
  document.getElementById('qtyInc')?.addEventListener('click', () => {
    let v = parseInt(qtyInput.value, 10) || 1;
    qtyInput.value = Math.min(avail, v + 1);
  });
  document.getElementById('addCartBtn')?.addEventListener('click', () => {
    if(!isFlightOpen()){
      showToast('Open a flight (full flight details + opening stock) before selling');
      return;
    }
    const max = avail;
    let qty = parseInt(qtyInput.value, 10) || 1;
    qty = Math.min(Math.max(1, qty), max);
    if(qty <= 0) return;
    let priceLabel = 'Listed', unitPrice = it.listedPrice;
    const checkedRadio = sheet.querySelector('input[name="priceChoice"]:checked');
    if(checkedRadio && checkedRadio.value === 'special'){
      priceLabel = 'Special'; unitPrice = it.specialPrice;
    } else if(checkedRadio && checkedRadio.value === 'crew'){
      priceLabel = 'Crew'; unitPrice = crewPrice;
    }
    const newType = isPassengerLabel(priceLabel) ? 'passenger' : 'crew';
    const existingType = cartTransactionType();
    if(existingType && existingType !== newType){
      showToast(`Cart already has ${existingType === 'crew' ? 'staff' : existingType} sales — clear or complete it before adding ${newType === 'crew' ? 'staff' : newType} sales.`);
      return;
    }
    addToCart(it, qty, unitPrice, priceLabel);
    showToast(`Added ${qty} × ${it.name} to cart`);
    updateCartBadge();
    openSheet(it);
  });

  document.getElementById('sheetBackdrop').classList.add('open');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* On the Home screen, pressing the device/browser back button asks for
   confirmation instead of immediately leaving the app. From any other
   screen, back navigates in-app to Home first (one tap = go home, not exit),
   matching how most mobile apps behave. Uses the History API since this is
   a single-page app with no per-screen URLs of its own. */
function pushExitGuardState(){
  try{ history.pushState({ appGuard: true }, '', location.href); } catch(e){}
}
pushExitGuardState();
let allowExitNow = false;
window.addEventListener('popstate', () => {
  if(allowExitNow) return;
  if(state.view !== 'home'){
    state.view = 'home';
    state.category = null;
    state.query = '';
    state.allowanceQuery = '';
    window.scrollTo(0,0);
    render();
    pushExitGuardState();
    return;
  }
  showConfirm('Do you want to exit from the Application?', () => {
    allowExitNow = true;
    try{ history.back(); } catch(e){}
  });
  pushExitGuardState();
});

/* Proactively fetch every bundled item photo once, while online, so the
   service worker's image cache has them ready before the device goes
   offline — rather than only caching photos as each item happens to be
   opened. Unchanged photos already cached are served instantly with no
   network request at all. */
function warmImageCache(){
  if(!navigator.onLine) return;
  ITEMS.forEach(it => {
    if(it.image && it.image.indexOf('data:') !== 0){
      fetch(it.image, { cache: 'force-cache' }).catch(() => {});
    }
  });
}

if('serviceWorker' in navigator){
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // A newer service worker just took control — reload once so the
    // freshest index.html is actually loaded, instead of waiting for
    // whatever navigation happens to come next.
    if(swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then((registration) => {
        warmImageCache();
        // Don't rely solely on the browser's own update-check timing —
        // ask explicitly, now and periodically, so a device that opens
        // online actually notices a newer sw.js promptly.
        registration.update().catch(() => {});
        setInterval(() => registration.update().catch(() => {}), 5 * 60 * 1000);
      })
      .catch(() => { warmImageCache(); });
  });
} else {
  warmImageCache();
}
</script>
