<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E4">
<title>Serendib Treasures — Catalog</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Serendib">
<style>
  :root{
    --paper:#F5F0E4;
    --paper-raised:#FBF8F0;
    --ink:#2A241C;
    --ink-soft:#6B6153;
    --hairline:#DCD3BF;
    --blue:#CBDCE4;
    --blue-ink:#2E5A6C;
    --pink:#EFD2D6;
    --pink-ink:#8C3D48;
    --gold:#A8763A;
    --gold-light:#E0B978;
    --stub-notch: 14px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    background-image: radial-gradient(ellipse at top, rgba(176,138,78,0.10) 0%, rgba(245,240,228,0) 55%);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  .mono{
    font-family: ui-monospace, "SF Mono", "Courier New", monospace;
    letter-spacing:0.02em;
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    padding:22px 18px 14px;
    border-bottom:1px dashed var(--hairline);
    overflow:hidden;
  }
  .header-feather{
    position:absolute; top:-16px; right:-24px;
    width:175px; height:auto;
    transform:rotate(7deg);
    pointer-events:none;
    opacity:0.92;
    -webkit-mask-image: linear-gradient(to left, black 38%, transparent 92%);
    mask-image: linear-gradient(to left, black 38%, transparent 92%);
    filter: drop-shadow(0 6px 10px rgba(20,16,10,0.14));
    z-index:0;
  }
  .header-content{ position:relative; z-index:1; }
  .brand-row{
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .brand{
    font-size:1.55rem; font-weight:700; letter-spacing:0.01em;
  }
  .brand span{
    background: linear-gradient(120deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-style:italic; font-weight:400;
  }
  .eyebrow{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.62rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--ink-soft); margin-top:2px;
  }
  .tagline{
    margin-top:6px; font-size:0.85rem; color:var(--ink-soft); font-style:italic;
  }
  .datetime-bar{
    margin-top:5px; font-family: ui-monospace, "Courier New", monospace;
    font-size:0.7rem; letter-spacing:0.02em; color:var(--ink-soft); opacity:0.85;
  }
  .datetime-time{ color:var(--gold); font-weight:700; opacity:1; }
  .clock-colon{ animation: clock-blink 1s steps(1, end) infinite; }
  @keyframes clock-blink{ 50%{ opacity:0; } }
  .offline-banner{
    margin-top:8px; padding:8px 12px; border-radius:10px;
    background:rgba(140,61,72,0.12); border:1px solid var(--pink-ink);
    display:flex; align-items:center; gap:8px;
    font-size:0.74rem; font-weight:700; color:var(--pink-ink); line-height:1.3;
  }
  .offline-banner svg{ width:16px; height:16px; flex-shrink:0; }
  .gold-rule{
    height:2px; margin-top:12px; border-radius:2px;
    background:linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    opacity:0.55;
  }

  .search-wrap{ margin:0 0 16px; position:relative; }
  .search-wrap input{
    width:100%; padding:13px 46px 13px 38px;
    border:1px solid var(--hairline); border-radius:999px;
    background:var(--paper-raised);
    font-family:Georgia, serif; font-size:0.92rem; color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{ border-color:var(--gold); }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:0.55; }
  .search-clear-btn{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; border-radius:50%; border:none;
    background:var(--hairline); color:var(--ink-soft);
    font-size:1.25rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .quick-actions{ display:flex; gap:8px; margin-top:12px; }
  .flight-info-bar{
    margin-top:10px; padding:7px 12px; border-radius:10px;
    background:rgba(168,118,58,0.12); border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.74rem; font-weight:700; letter-spacing:0.03em;
    color:var(--ink);
  }
  .flight-info-bar svg{ width:13px; height:13px; color:var(--gold); flex-shrink:0; }
  .qa-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:12px 6px; min-height:44px; border:3px solid var(--hairline); border-radius:12px;
    background:var(--paper-raised); font-family:Georgia, serif; font-size:0.76rem;
    color:var(--ink); cursor:pointer; position:relative;
  }
  #stockBtn{ border-color:#F05F20; }
  #cartBtn{ border-color:#038F42; }
  #sessionBtn{ border-color:#D5113F; }
  .qa-btn svg{ width:15px; height:15px; opacity:0.65; flex-shrink:0; }
  .qa-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .qa-badge{
    position:absolute; top:-7px; right:-7px;
    background:var(--gold); color:#fff; font-family: ui-monospace, monospace;
    font-size:0.62rem; min-width:18px; height:18px; border-radius:999px;
    display:none; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---------- Opening stock ---------- */
  .stock-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 4px; border-bottom:1px dashed var(--hairline);
  }
  .stock-mid{ flex:1; min-width:0; }
  .stock-input{
    width:64px; padding:9px 6px; text-align:center; flex-shrink:0;
    border:1px solid var(--hairline); border-radius:8px;
    font-family: ui-monospace, "Courier New", monospace; font-size:0.92rem;
    background:var(--paper-raised); color:var(--ink);
  }
  .stock-input:focus{ outline:none; border-color:var(--gold); }
  .stock-note{
    font-size:0.66rem; color:var(--ink-soft); margin-top:2px;
  }
  .stock-spacer{ height:78px; }

  /* ---------- Flight info panel (Date & Flight Number) ---------- */
  .flight-info-panel{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 6px; }
  .flight-field{ flex:1 1 140px; min-width:140px; }
  .flight-label{
    display:block; font-family: ui-monospace, "Courier New", monospace;
    font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:5px;
  }
  .flight-input{
    width:100%; padding:10px 11px; border:1px solid var(--hairline); border-radius:10px;
    background:var(--paper-raised); font-family:Georgia, serif; font-size:0.85rem;
    color:var(--ink); outline:none;
  }
  .flight-input:focus{ border-color:var(--gold); }
  .stock-gate-note{
    display:flex; align-items:center; gap:8px;
    margin:14px 0 4px; padding:10px 12px;
    background:rgba(140,61,72,0.08); border:1px solid var(--pink-ink);
    border-radius:10px; color:var(--pink-ink); font-size:0.8rem; font-style:italic;
  }
  .stock-gate-note svg{ width:18px; height:18px; flex-shrink:0; }
  .stock-input:disabled{ opacity:0.4; cursor:not-allowed; background:var(--paper); }

  /* ---------- Floating bottom action bar ---------- */
  .floating-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 65%, rgba(245,240,228,0));
    pointer-events:none;
  }
  .floating-bar-inner{ width:100%; max-width:640px; pointer-events:auto; display:flex; gap:10px; }
  .floating-save-btn{
    flex:1; padding:14px; border:none; border-radius:14px;
    background:var(--ink); color:var(--paper-raised); font-family:Georgia, serif;
    font-size:0.98rem; font-weight:700; cursor:pointer;
    box-shadow:0 6px 18px rgba(20,16,10,0.22);
  }
  .floating-reset-btn{
    flex:1; padding:14px; border:1px solid var(--hairline); border-radius:14px;
    background:var(--paper-raised); color:var(--pink-ink); font-family:Georgia, serif;
    font-size:0.98rem; font-weight:700; cursor:pointer;
    box-shadow:0 6px 18px rgba(20,16,10,0.1);
  }
  .floating-home-bar-inner{ width:100%; max-width:640px; pointer-events:auto; display:flex; justify-content:center; }
  .floating-home-btn{
    width:auto; padding:11px 26px; border:none; border-radius:999px;
    background:#E07A2C; color:#FBF8F0; font-family:Georgia, serif;
    font-size:0.86rem; font-weight:700; cursor:pointer;
    box-shadow:0 6px 18px rgba(20,16,10,0.22);
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .floating-home-btn svg{ width:15px; height:15px; }
  .bottom-spacer{ height:78px; }

  /* ---------- Sale panel (inside item sheet) ---------- */
  .sale-panel{
    margin-top:18px; border-top:1px dashed var(--hairline); padding-top:14px;
  }
  .stock-line{ font-size:0.78rem; color:var(--ink-soft); margin-bottom:12px; font-style:italic; }
  .stock-line.out-of-stock{ color:var(--pink-ink); font-weight:700; font-style:normal; }
  .qty-btn:disabled, .qty-input:disabled{ opacity:0.4; cursor:not-allowed; }
  .price-choice{ display:flex; gap:8px; margin-bottom:14px; }
  .price-opt{
    flex:1; border:1px solid var(--hairline); border-radius:10px; padding:8px 6px;
    text-align:center; font-size:0.78rem; color:var(--ink-soft); cursor:pointer;
  }
  .price-opt input{ display:none; }
  .price-opt.selected{ border-color:var(--gold); background:rgba(176,138,78,0.08); color:var(--ink); }
  .price-opt b{ font-family: ui-monospace, monospace; font-size:0.92rem; color:var(--ink); display:block; margin-top:2px; }
  .price-opt.disabled{ opacity:0.35; cursor:not-allowed; }
  .tx-lock-note{
    font-size:0.72rem; color:var(--pink-ink); font-style:italic;
    margin:-6px 0 14px;
  }

  /* ---------- Payment method screen ---------- */
  .payment-method-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 4px; }
  .payment-method-btn{
    padding:15px 8px; border:1.5px solid var(--hairline); border-radius:12px;
    background:var(--paper-raised); font-family:Georgia, serif; font-size:0.85rem;
    font-weight:700; color:var(--ink); cursor:pointer; text-align:center;
  }
  .payment-method-btn.selected{ border-color:var(--gold); background:rgba(176,138,78,0.1); }
  .payment-line-form{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 4px;
  }
  .payment-select{
    flex:1; min-width:90px; padding:11px 8px; border:1px solid var(--hairline);
    border-radius:10px; background:var(--paper-raised); font-family:Georgia, serif;
    font-size:0.85rem; color:var(--ink);
  }
  .payment-amount-input{
    flex:1; min-width:90px; padding:11px 10px; border:1px solid var(--hairline);
    border-radius:10px; background:var(--paper-raised); font-family: ui-monospace, monospace;
    font-size:0.9rem; color:var(--ink);
  }
  .payment-add-btn{
    padding:11px 18px; border:none; border-radius:10px; background:var(--ink);
    color:var(--paper-raised); font-family:Georgia, serif; font-size:0.85rem;
    font-weight:700; cursor:pointer;
  }
  .payment-lines-list{ margin-top:8px; }
  .payment-line-row{
    display:flex; align-items:center; gap:10px; padding:11px 4px;
    border-bottom:1px dashed var(--hairline);
  }
  .payment-line-info{ flex:1; min-width:0; }
  .payment-line-method{ font-size:0.78rem; color:var(--ink); }
  .payment-line-amt{ font-size:0.88rem; font-weight:700; color:var(--gold); flex-shrink:0; }
  .payment-line-remove{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--paper); color:var(--ink-soft); font-size:1.1rem; line-height:1;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }

  .qty-stepper{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .qty-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--paper-raised); font-size:1.25rem; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .qty-btn.sm{ width:38px; height:38px; font-size:1.05rem; }
  .qty-input{
    width:60px; text-align:center; padding:9px 4px; border:1px solid var(--hairline);
    border-radius:8px; font-family: ui-monospace, monospace; font-size:0.95rem;
    background:var(--paper-raised); color:var(--ink);
  }
  .add-cart-btn{
    width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--ink); color:var(--paper-raised); font-family:Georgia, serif;
    font-size:0.95rem; font-weight:700; cursor:pointer;
  }
  .add-cart-btn:disabled{ background:var(--hairline); color:var(--ink-soft); cursor:not-allowed; }

  /* ---------- Cart ---------- */
  .cart-row{ display:flex; align-items:flex-start; gap:12px; padding:14px 4px; border-bottom:1px dashed var(--hairline); }
  .cart-qty-stepper{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .crew-staff-fields{ display:flex; gap:8px; margin-top:8px; }
  .crew-staff-input{
    min-width:0; padding:9px 10px; border:1px solid var(--hairline);
    border-radius:8px; background:var(--paper-raised); font-family:Georgia, serif;
    font-size:0.78rem; color:var(--ink);
  }
  .staff-no-input{ flex:1; }
  .staff-name-input{ flex:2; }
  .crew-staff-input:invalid, .crew-staff-input.missing{ border-color:var(--pink-ink); }
  .cart-qty{ font-family: ui-monospace, monospace; font-size:0.85rem; min-width:14px; text-align:center; }
  .cart-remove{
    margin-left:6px; background:none; border:none; color:var(--pink-ink);
    font-family:Georgia, serif; font-size:0.8rem; text-decoration:underline; cursor:pointer;
    padding:10px 6px; min-height:44px;
  }
  .cart-footer{ margin-top:18px; padding-top:16px; border-top:1px solid var(--hairline); padding-bottom:10px; }
  .cart-total-line{ display:flex; justify-content:space-between; font-size:1.15rem; font-weight:700; margin-bottom:14px; }
  .clear-cart-btn{
    width:100%; margin-top:10px; padding:11px; background:none;
    border:1px solid var(--hairline); border-radius:12px; color:var(--ink-soft);
    font-family:Georgia, serif; font-size:0.85rem; cursor:pointer;
  }

  /* ---------- Session summary ---------- */
  .session-row{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px dashed var(--hairline); }
  .session-row-mid{ flex:1; min-width:0; }
  .session-subtotal{
    display:flex; justify-content:space-between; padding:10px 4px 4px;
    font-weight:700; font-size:0.88rem; border-top:1px solid var(--hairline); margin-top:2px;
  }
  .session-tag{
    display:inline-block; font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--gold); border:1px solid var(--gold); border-radius:999px;
    padding:1px 7px; margin-top:4px;
  }
  .refund-toggle-btn{
    display:inline-block; margin-top:8px; padding:6px 12px; border:1px solid var(--pink-ink);
    border-radius:999px; background:none; color:var(--pink-ink);
    font-family:Georgia, serif; font-size:0.7rem; font-weight:700; cursor:pointer;
  }
  .refund-form{
    display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:10px; flex-wrap:wrap;
  }
  .refund-qty-input{
    width:64px; padding:8px 10px; border:1px solid var(--hairline); border-radius:8px;
    background:var(--paper-raised); font-family: ui-monospace, monospace; font-size:0.85rem;
  }
  .refund-confirm-btn{
    padding:8px 14px; border:none; border-radius:8px; background:var(--pink-ink);
    color:#FBF8F0; font-family:Georgia, serif; font-size:0.74rem; font-weight:700; cursor:pointer;
  }
  .refund-cancel-btn{
    padding:8px 14px; border:1px solid var(--hairline); border-radius:8px; background:none;
    color:var(--ink-soft); font-family:Georgia, serif; font-size:0.74rem; cursor:pointer;
  }

  /* ---------- Custom confirm modal (native confirm() is unreliable in sandboxed previews) ---------- */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(20,16,10,0.45);
    z-index:70; display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none; transition:opacity 0.15s ease;
  }
  .confirm-overlay.open{ opacity:1; pointer-events:auto; }
  .confirm-box{
    background:var(--paper-raised); border-radius:16px; padding:22px 20px;
    width:100%; max-width:340px;
    box-shadow:0 12px 32px rgba(0,0,0,0.25);
    transform:scale(0.96); transition:transform 0.15s ease;
  }
  .confirm-overlay.open .confirm-box{ transform:scale(1); }
  .confirm-msg{
    font-family:Georgia, serif; font-size:0.98rem; line-height:1.45;
    color:var(--ink); margin-bottom:18px; text-align:center;
  }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-btn{
    flex:1; padding:13px; min-height:44px; border-radius:12px; font-family:Georgia, serif;
    font-size:0.92rem; cursor:pointer;
  }
  .confirm-btn.cancel{ background:none; border:1px solid var(--hairline); color:var(--ink-soft); }
  .confirm-btn.ok{ background:var(--pink-ink); border:none; color:#fff; font-weight:700; }

  /* ---------- Home: category grid ---------- */
  main{ padding:16px; max-width:640px; margin:0 auto; }

  .section-label{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-soft); margin: 18px 4px 10px;
  }

  .cat-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px;
  }
  .cat-grid .cat-card:last-child:nth-child(odd){
    grid-column: 1 / -1;
    justify-self: center;
    width: calc(50% - 7px);
  }
  .cat-card{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    display:flex; flex-direction:column;
    border:1.5px solid var(--gold);
    box-shadow: 0 10px 22px rgba(20,16,10,0.16), inset 0 0 0 1px rgba(255,255,255,0.5);
    cursor:pointer;
    text-decoration:none; color:var(--ink);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cat-card:active{ transform:scale(0.96); box-shadow:0 4px 10px rgba(20,16,10,0.18); }
  .cat-thumb{
    width:100%; aspect-ratio: 4 / 3;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper-raised);
    overflow:hidden;
  }
  .cat-thumb img{ width:auto; height:100%; max-width:100%; object-fit:contain; display:block; }
  .cat-icon-badge{
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 5px 12px rgba(20,16,10,0.28);
  }
  .cat-icon-badge svg{ width:26px; height:26px; color:#FBF8F0; opacity:0.96; }
  .cat-body{
    padding:13px 14px 15px;
    display:flex; flex-direction:column; justify-content:space-between;
    flex:1;
    border-top:1px solid rgba(255,255,255,0.16);
  }
  .cat-card .cat-name{
    font-size:1.05rem; line-height:1.24; font-weight:700; color:#FBF8F0;
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .cat-card .cat-meta{
    display:flex; justify-content:space-between; align-items:flex-end;
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.68rem; margin-top:9px; color:rgba(251,248,240,0.8);
  }
  .cat-card .arrow{ font-size:1.1rem; color:var(--gold-light); }

  .stock-cat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:12px; }
  .stock-cat-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:16px 10px; min-height:76px; border-radius:14px;
    border:1.5px solid var(--hairline); background:var(--paper-raised);
    cursor:pointer; text-align:center;
  }
  .stock-cat-name{
    font-family:Georgia, serif; font-size:0.88rem; font-weight:700;
    color:var(--ink); line-height:1.25;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .stock-cat-sub{ font-size:0.68rem; color:var(--ink-soft); }
  .stock-cat-btn.confirmed{
    border-color:#2E7D46; background:rgba(46,125,70,0.08);
  }
  .stock-cat-btn.confirmed .stock-cat-name{ color:#2E7D46; }
  .stock-cat-check-inline{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; background:#2E7D46; flex-shrink:0;
  }
  .stock-cat-check-inline svg{ width:9px; height:9px; color:#fff; }
  .add-cart-btn.confirmed-btn{
    background:#2E7D46; border-color:#2E7D46;
  }

  .util-section-card{
    margin-top:20px; padding:14px 12px 12px; border-radius:18px;
    background:rgba(168,118,58,0.07); border:1px solid rgba(168,118,58,0.35);
  }
  .util-section-label{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.68rem; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--gold); margin-bottom:10px;
    text-align:center;
  }
  .util-row{ display:flex; gap:8px; }
  .util-bar-btn{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 4px; border-radius:14px; border:1.5px dashed var(--gold);
    background:var(--paper-raised); cursor:pointer; text-align:center;
    box-shadow:0 3px 8px rgba(20,16,10,0.06);
  }
  .util-bar-icon{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .util-bar-icon svg{ width:15px; height:15px; color:#FBF8F0; }
  .util-bar-title{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.6rem; font-weight:800; letter-spacing:0.015em;
    text-transform:uppercase; color:var(--ink); line-height:1.32;
    -webkit-text-stroke: 0.25px currentColor;
  }

  .rate-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 6px; border-bottom:1px dashed var(--hairline);
  }
  .rate-code{ font-size:0.95rem; font-weight:700; letter-spacing:0.06em; color:var(--ink); }
  .rate-value{ font-size:0.95rem; font-weight:700; color:var(--gold); }

  /* ---------- Pre-orders ---------- */
  .preorder-selected-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 12px; border:1px solid var(--gold); border-radius:10px;
    background:rgba(176,138,78,0.08);
  }
  .preorder-search-results{
    margin-top:6px; border:1px solid var(--hairline); border-radius:10px; overflow:hidden;
  }
  .preorder-search-result{
    padding:11px 12px; border-bottom:1px solid var(--hairline); cursor:pointer;
    background:var(--paper-raised);
  }
  .preorder-search-result:last-child{ border-bottom:none; }
  .preorder-search-result:active{ background:rgba(176,138,78,0.1); }
  .preorder-total-display{
    padding:11px 12px; border:1px solid var(--hairline); border-radius:10px;
    background:var(--paper); font-size:0.95rem; font-weight:700; color:var(--gold);
  }
  .preorder-staff-check{
    display:flex; align-items:flex-start; gap:10px; margin-top:14px;
    padding:12px; border:1px solid var(--hairline); border-radius:10px;
    background:var(--paper-raised); font-family:Georgia, serif; font-size:0.85rem;
    color:var(--ink); cursor:pointer;
  }
  .preorder-staff-check input{ margin-top:2px; width:18px; height:18px; flex-shrink:0; }
  .preorder-staff-hint{ font-size:0.72rem; color:var(--ink-soft); font-style:italic; }
  .preorder-cart-row{
    padding:14px; margin-bottom:14px; border:1px solid var(--hairline);
    border-radius:14px; background:var(--paper-raised);
    box-shadow:0 3px 8px rgba(20,16,10,0.06);
  }

  /* Rich jewel-tone palette, one per category */
  .cat-card.jc0 .cat-body, .cat-card.jc0 .cat-icon-badge{ background:linear-gradient(135deg, #2A5C5C 0%, #163634 100%); }
  .cat-card.jc1 .cat-body, .cat-card.jc1 .cat-icon-badge{ background:linear-gradient(135deg, #7A2C4E 0%, #4A1730 100%); }
  .cat-card.jc2 .cat-body, .cat-card.jc2 .cat-icon-badge{ background:linear-gradient(135deg, #55336F 0%, #331F47 100%); }
  .cat-card.jc3 .cat-body, .cat-card.jc3 .cat-icon-badge{ background:linear-gradient(135deg, #A8492F 0%, #7A2E22 100%); }
  .cat-card.jc4 .cat-body, .cat-card.jc4 .cat-icon-badge{ background:linear-gradient(135deg, #253E6B 0%, #16223E 100%); }
  .cat-card.jc5 .cat-body, .cat-card.jc5 .cat-icon-badge{ background:linear-gradient(135deg, #256B45 0%, #163E28 100%); }
  .cat-card.jc6 .cat-body, .cat-card.jc6 .cat-icon-badge{ background:linear-gradient(135deg, #7D4E27 0%, #4C2E16 100%); }
  .cat-card.preorders-card .cat-body, .cat-card.preorders-card .cat-icon-badge{ background:linear-gradient(135deg, #B0672E 0%, #723F16 100%); }

  /* ---------- Category / list view ---------- */
  .list-title{
    font-size:1.35rem; font-weight:700; margin: 6px 0 2px;
  }
  .list-count{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.7rem; color:var(--ink-soft); letter-spacing:0.08em;
    text-transform:uppercase; margin-bottom:14px;
  }

  .item-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 4px;
    border-bottom:1px dashed var(--hairline);
    cursor:pointer;
  }
  .item-row:active{ background:rgba(176,138,78,0.06); }
  .item-thumb{
    width:46px; height:46px; flex-shrink:0;
    border-radius:10px; overflow:hidden;
    background:var(--paper); border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .item-thumb img{ width:auto; height:100%; max-width:100%; object-fit:contain; display:block; }
  .item-thumb svg{ width:19px; height:19px; color:var(--ink-soft); opacity:0.6; }
  .item-no{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.66rem; color:var(--ink-soft);
  }
  .item-mid{ flex:1; min-width:0; }
  .item-name{
    font-size:0.94rem; font-weight:700; line-height:1.25;
  }
  .item-code{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.66rem; color:var(--ink-soft); margin-top:3px; letter-spacing:0.03em;
  }
  .row-stock-tag{
    font-size:0.66rem; color:var(--ink-soft); margin-top:2px; font-style:italic;
  }
  .row-stock-tag.out-of-stock{
    color:var(--pink-ink); font-weight:700; font-style:normal;
  }
  .item-price{
    text-align:right; flex-shrink:0;
  }
  .item-price .amt{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.95rem; font-weight:600;
  }
  .item-price .tag{
    font-size:0.6rem; color:var(--gold); letter-spacing:0.06em; text-transform:uppercase;
    margin-top:2px;
  }

  /* ---------- Item detail (sheet) ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,16,10,0.35);
    z-index:40; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--paper-raised);
    width:100%; max-width:640px; margin:0 auto;
    border-radius:22px 22px 0 0;
    max-height:88vh; overflow-y:auto;
    padding:10px 22px 30px;
    transform:translateY(24px);
    transition:transform 0.2s ease;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.15);
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:38px; height:4px; border-radius:4px; background:var(--hairline);
    margin: 10px auto 14px;
  }
  .sheet-thumb{
    width:100%; aspect-ratio: 4 / 3;
    border-radius:14px; overflow:hidden;
    background:var(--paper); border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    position:relative; margin-bottom:14px;
  }
  .sheet-thumb img{ width:auto; height:100%; max-width:100%; object-fit:contain; display:block; }
  .sheet-thumb svg{ width:15%; height:15%; color:var(--ink-soft); opacity:0.55; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--ink); color:var(--paper-raised);
    padding:10px 18px; border-radius:999px;
    font-family:Georgia, serif; font-size:0.82rem;
    z-index:60; opacity:0; transition:all 0.25s ease; pointer-events:none;
    max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .sheet-eyebrow{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .sheet-name{ font-size:1.28rem; font-weight:700; margin:6px 0 12px; line-height:1.3; }
  .sheet-desc{ font-size:0.92rem; line-height:1.55; color:var(--ink); }
  .price-panel{
    margin-top:18px; border-top:1px dashed var(--hairline); padding-top:14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .price-line{ display:flex; justify-content:space-between; align-items:center; }
  .price-line .lbl{ font-size:0.8rem; color:var(--ink-soft); }
  .val-col{ display:flex; flex-direction:column; align-items:flex-end; }
  .price-line .val{ font-family: ui-monospace, "Courier New", monospace; font-size:1.05rem; font-weight:700; }
  .price-line.special .val{ color:var(--gold); }
  .val-converted{
    font-family: ui-monospace, "Courier New", monospace; font-size:0.72rem;
    color:var(--ink-soft); margin-top:1px;
  }
  .price-line .val-col.showing-converted .val{
    font-size:0.76rem; font-weight:600; color:var(--ink-soft); margin-bottom:1px;
  }
  .price-line .val-col.showing-converted .val-converted{
    font-size:1.3rem; font-weight:800; color:var(--gold); margin-top:0;
    letter-spacing:0.01em;
  }
  .price-currency-row{
    display:flex; align-items:center; gap:10px; margin-top:16px;
  }
  .price-currency-row .flight-label{ margin-bottom:0; white-space:nowrap; }
  .price-currency-row .payment-select{ flex:1; }
  .sheet-sticky-bar{
    position:sticky; top:0; z-index:5;
    display:flex; justify-content:flex-end;
    height:0; overflow:visible; pointer-events:none;
  }
  .close-btn{
    position:static; margin-top:10px; margin-right:10px; flex-shrink:0;
    pointer-events:auto;
    width:44px; height:44px; border-radius:50%;
    background:var(--paper-raised); border:1px solid var(--hairline);
    box-shadow:0 2px 8px rgba(20,16,10,0.12);
    font-size:1.5rem; color:var(--ink-soft);
    cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-style:italic;
  }

  ::-webkit-scrollbar{ width:0; height:0; }

  /* ---------- Printable flight report (screen: hidden; print: only thing shown) ---------- */
  .print-only{ display:none; }
  .report-download-btn{
    width:100%; padding:13px; margin-top:10px; border:1.5px solid var(--ink);
    border-radius:12px; background:none; color:var(--ink);
    font-family:Georgia, serif; font-size:0.92rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .report-download-btn svg{ width:16px; height:16px; }

  /* ---------- Past closed flight cards ---------- */
  .archive-card{
    border:1px solid var(--hairline); border-radius:14px;
    background:var(--paper-raised); padding:14px 16px; margin-bottom:12px;
    box-shadow:0 3px 8px rgba(20,16,10,0.07);
  }
  .archive-card-header{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  }
  .archive-card-title{ font-size:1rem; font-weight:700; }
  .archive-card-total{
    font-family: ui-monospace, "Courier New", monospace;
    font-size:1rem; font-weight:700; color:var(--gold); flex-shrink:0;
  }
  .archive-card-meta{
    font-size:0.72rem; color:var(--ink-soft); margin-top:3px; font-style:italic;
  }
  .archive-card-stats{
    font-size:0.76rem; color:var(--ink-soft); margin-top:8px;
    padding-top:8px; border-top:1px dashed var(--hairline);
  }
  .archive-actions{ display:flex; gap:8px; margin-top:12px; }
  .archive-btn{
    padding:8px 14px; min-height:36px; border:1px solid var(--hairline);
    border-radius:10px; background:var(--paper); color:var(--ink);
    font-family:Georgia, serif; font-size:0.74rem; font-weight:700; cursor:pointer;
  }
  .archive-btn.danger{ border-color:var(--pink-ink); color:var(--pink-ink); }
  @media print{
    body > *:not(#reportPrintArea){ display:none !important; }
    #reportPrintArea.print-only{ display:block !important; }
    body{ background:#fff; }
    .rpt-page{ font-family: Georgia, 'Times New Roman', serif; color:#1a1a1a; padding:0; }
    .rpt-title{ font-size:1.4rem; font-weight:700; margin-bottom:2px; }
    .rpt-subtitle{ font-size:0.85rem; color:#555; margin-bottom:18px; }
    .rpt-meta{ width:100%; border-collapse:collapse; margin-bottom:20px; font-size:0.85rem; }
    .rpt-meta td{ padding:4px 10px 4px 0; border-bottom:1px solid #ddd; }
    .rpt-meta td.rpt-label{ color:#666; width:160px; }
    .rpt-section-title{
      font-size:1.05rem; font-weight:700; margin:22px 0 8px;
      border-bottom:2px solid #1a1a1a; padding-bottom:4px;
    }
    .rpt-table{ width:100%; border-collapse:collapse; font-size:0.8rem; margin-bottom:6px; }
    .rpt-table th{
      text-align:left; border-bottom:1.5px solid #1a1a1a; padding:5px 8px;
      font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;
    }
    .rpt-table td{ padding:5px 8px; border-bottom:1px solid #ddd; }
    .rpt-table td.num, .rpt-table th.num{ text-align:right; }
    .rpt-subtotal-row td{ font-weight:700; border-top:1.5px solid #1a1a1a; border-bottom:none; }
    .rpt-grand-total{
      display:flex; justify-content:space-between; align-items:center;
      font-size:1.15rem; font-weight:700; margin:16px 0 4px;
      border-top:2px solid #1a1a1a; border-bottom:2px solid #1a1a1a; padding:10px 0;
    }
    .rpt-empty{ color:#777; font-style:italic; font-size:0.85rem; padding:6px 0; }
    .rpt-footer{ margin-top:26px; font-size:0.7rem; color:#888; }
    @page{ margin:16mm 14mm; }
  }

</style>
</head>

];

/* Display-only labels shown to the user; ITEMS[].category / state.category
   keep using the original names above so item filtering is unaffected. */
const CATEGORY_LABELS = {
  "Timepieces": "Timepieces & Fashion Accessories",
  "Scents For Him & Her": "Fragrance"
};
function catLabel(cat){ return CATEGORY_LABELS[cat] || cat; }

/* Items that carry an additional USD 10 discount for passengers who pay in
   cash at checkout (on top of whatever price tier — Listed or Special —
   they're buying at). Does not apply to staff sales, and only applies when
   the whole sale is settled 100% by Cash (not a Mix payment). */
const CASH_DISCOUNT_ITEMS = new Set([1,2,3,4,5,6,7,11,12,13,14,16,18,19,54,55,83]);
const CASH_DISCOUNT_USD = 10;
/* Total USD 10-per-eligible-unit cash discount available on the current cart,
   counting only passenger-priced (Listed/Special) lines for eligible items. */
function cashDiscountUSD(){
  return cart.reduce((s, c) => {
    if(isPassengerLabel(c.priceLabel) && CASH_DISCOUNT_ITEMS.has(c.itemNo)){
      return s + c.qty * CASH_DISCOUNT_USD;
    }
    return s;
  }, 0);
}
/* Amount actually due for the current cart under a given payment method —
   the cash discount only applies when the sale is settled 100% by Cash. */
function saleDueTotal(method){
  const total = cartTotal();
  const discount = method === 'cash' ? cashDiscountUSD() : 0;
  return Math.max(0, total - discount);
}

/* Items with no crew discount — crew pays the listed price for these */
const NO_CREW_DISCOUNT_ITEMS = new Set([]);
/* Item-specific crew (staff) prices that override the standard 75%-of-listed
   calculation — sourced from the "Duty Free Purchases for SriLankan Employees"
   special-discount list (liquor & tobacco staff discounted prices). */
const CREW_PRICE_OVERRIDES = {};
/* Round-half-to-even ("banker's rounding"): .5 goes to the nearest EVEN
   whole number (24.5 → 24, 25.5 → 26); anything else rounds to whichever
   whole number is actually closest. */
function bankersRound(num){
  const floor = Math.floor(num);
  const diff = num - floor;
  if(diff < 0.5) return floor;
  if(diff > 0.5) return floor + 1;
  return (floor % 2 === 0) ? floor : floor + 1;
}
function getCrewPrice(it){
  if(NO_CREW_DISCOUNT_ITEMS.has(it.itemNo)) return it.listedPrice;
  if(CREW_PRICE_OVERRIDES[it.itemNo] !== undefined) return CREW_PRICE_OVERRIDES[it.itemNo];
  return it.staffPrice !== undefined ? it.staffPrice : bankersRound(it.listedPrice * 0.75);
}

/* ---------- Custom home-tile images (independent of any single item's product
   photo). When set for a category, this image is used for its home tile
   instead of falling back to the first item photo in that category. ---------- */
const CATEGORY_TILE_IMAGES = {
  "Timepieces": "images/tile-timepieces.png",
  "Jewellery": "images/tile-jewellery.png",
  "Scents For Him & Her": "images/tile-fragrance.png",

/* ---------- Item photos: bundled directly in the catalog data (it.image),
   provided as real files at build time — no in-app upload or local storage. ---------- */
function getItemImage(it){
  return it.image || null;
}
function firstImageForCategory(cat){
  const inCat = ITEMS.filter(it => it.category === cat).sort((a,b)=>a.itemNo-b.itemNo);
  for(const it of inCat){
    const img = getItemImage(it);
    if(img) return img;
  }
  return null;

/* ---------- Custom confirm modal (replaces native confirm(), which is unreliable in sandboxed previews) ---------- */
let _confirmResolve = null;
function showConfirm(message, onConfirm){
  const overlay = document.getElementById('confirmOverlay');
  document.getElementById('confirmMsg').textContent = message;
  overlay.classList.add('open');
  _confirmResolve = onConfirm;
}
function hideConfirm(){
  document.getElementById('confirmOverlay').classList.remove('open');
  _confirmResolve = null;
}
document.getElementById('confirmCancelBtn').addEventListener('click', hideConfirm);
document.getElementById('confirmOkBtn').addEventListener('click', () => {
  const fn = _confirmResolve;
  hideConfirm();
  if(fn) fn();
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

let currentSheetItem = null;
let selectedDisplayCurrency = 'USD';
function updateSheetPriceConversion(){
  const currency = selectedDisplayCurrency;
  document.querySelectorAll('.val-col').forEach(col => {
    col.classList.toggle('showing-converted', currency !== 'USD');
  });
  document.querySelectorAll('.val-converted').forEach(el => {
    const usd = parseFloat(el.dataset.usd) || 0;
    if(currency === 'USD'){
      el.textContent = '';
      return;
    }
    const rate = getCurrencyRate(currency);
    if(!rate){ el.textContent = ''; return; }
    const converted = usd * rate;
    el.textContent = `≈ ${converted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currency}`;
  });
}

/* ---------- Opening stock storage ---------- */
function stockKey(code){ return 'stock_' + code; }
function getStock(itemCode){
  try{
    const v = localStorage.getItem(stockKey(itemCode));
    return v === null ? 0 : parseInt(v, 10);
  } catch(e){ return 0; }
}
function setStock(itemCode, qty){
  try{ localStorage.setItem(stockKey(itemCode), String(qty)); } catch(e){}
}
function removeStock(itemCode){
  try{ localStorage.removeItem(stockKey(itemCode)); } catch(e){}
}
function resetAllStock(){
  ITEMS.forEach(it => removeStock(it.itemCode));
}

/* ---------- Opening stock snapshot (fixed baseline for the current flight,
   separate from the live "stock_" value which gets decremented by sales) ---------- */
function openingStockKey(code){ return 'opening_stock_' + code; }
function getOpeningStockSnapshot(itemCode){
  try{
    const v = localStorage.getItem(openingStockKey(itemCode));
    return v === null ? 0 : parseInt(v, 10);
  } catch(e){ return 0; }
}
function setOpeningStockSnapshot(itemCode, qty){
  try{ localStorage.setItem(openingStockKey(itemCode), String(qty)); } catch(e){}
}
function clearAllOpeningStockSnapshots(){
  ITEMS.forEach(it => { try{ localStorage.removeItem(openingStockKey(it.itemCode)); } catch(e){} });
}

/* ---------- Flight info (Date & Flight Number for the current session) ---------- */
function getFlightInfo(){
  try{
    return {
      date: localStorage.getItem('flight_date') || '',
      number: (localStorage.getItem('flight_number') || '').toUpperCase(),
      sector: (localStorage.getItem('flight_sector') || '').toUpperCase(),
      staffNo: localStorage.getItem('flight_staff_no') || '',
      staffName: (localStorage.getItem('flight_staff_name') || '').toUpperCase()
    };
  } catch(e){ return { date:'', number:'', sector:'', staffNo:'', staffName:'' }; }
}
function setFlightDate(val){ try{ localStorage.setItem('flight_date', val); } catch(e){} }
function setFlightNumber(val){ try{ localStorage.setItem('flight_number', val); } catch(e){} }
function setFlightSector(val){ try{ localStorage.setItem('flight_sector', val); } catch(e){} }
function setFlightStaffNo(val){ try{ localStorage.setItem('flight_staff_no', val); } catch(e){} }
function setFlightStaffName(val){ try{ localStorage.setItem('flight_staff_name', val); } catch(e){} }
function clearFlightInfo(){
  try{
    localStorage.removeItem('flight_date');
    localStorage.removeItem('flight_number');
    localStorage.removeItem('flight_sector');
    // CSS Staff No and CSS Name are intentionally kept — the same crew member
    // typically operates this device across multiple flights, so re-entering
    // their details every time would just be repeated busywork.
  } catch(e){}
}
function flightDetailsComplete(){
  const info = getFlightInfo();
  return !!(info.date.trim() && info.number.trim() && info.sector.trim() && info.staffNo.trim() && info.staffName.trim());
}
/* ---------- Opening-stock category confirmation (each category must be
   reviewed and confirmed before the flight counts as fully open) ---------- */
function confirmedCategoriesKey(){ return 'stock_confirmed_categories'; }
function getConfirmedCategories(){
  try{ return JSON.parse(localStorage.getItem(confirmedCategoriesKey()) || '[]'); } catch(e){ return []; }
}
function isCategoryConfirmed(cat){
  return getConfirmedCategories().indexOf(cat) !== -1;
}
function setCategoryConfirmed(cat, confirmed){
  const list = getConfirmedCategories();
  const idx = list.indexOf(cat);
  if(confirmed && idx === -1) list.push(cat);
  if(!confirmed && idx !== -1) list.splice(idx, 1);
  try{ localStorage.setItem(confirmedCategoriesKey(), JSON.stringify(list)); } catch(e){}
}
function clearConfirmedCategories(){
  try{ localStorage.removeItem(confirmedCategoriesKey()); } catch(e){}
}
/* ---------- Pre-orders (pre-arranged sales entered manually, item searched
   from the catalog but price entered by hand — kept separate from the
   normal cart/report pipeline). Two layers:
   - "journal" (preorders_current): a log of each Add-a-Pre-order action on
     the Open Flight page, for visibility/undo there.
   - "pool" (preorder_stock_<code>): the actual sellable balance per item,
     incremented when a journal entry is added, decremented when sent to
     cart, and restored if a pre-order-sourced cart line is later reduced
     or removed before the sale completes. ---------- */
function loadPreOrders(){
  try{ return JSON.parse(localStorage.getItem('preorders_current') || '[]'); } catch(e){ return []; }
}
function savePreOrders(list){
  try{ localStorage.setItem('preorders_current', JSON.stringify(list)); } catch(e){}
}
function clearPreOrders(){
  try{ localStorage.removeItem('preorders_current'); } catch(e){}
  ITEMS.forEach(it => { try{ localStorage.removeItem(preorderStockKey(it.itemCode)); } catch(e){} });
}
function preorderStockKey(code){ return 'preorder_stock_' + code; }
function getPreorderStock(itemCode){
  try{
    const v = localStorage.getItem(preorderStockKey(itemCode));
    return v === null ? 0 : parseInt(v, 10);
  } catch(e){ return 0; }
}
function setPreorderStock(itemCode, qty){
  try{ localStorage.setItem(preorderStockKey(itemCode), String(Math.max(0, qty))); } catch(e){}
}
function addPreorderStock(itemCode, qty){
  setPreorderStock(itemCode, getPreorderStock(itemCode) + qty);
}
function totalPreorderStock(){
  return ITEMS.reduce((sum, it) => sum + getPreorderStock(it.itemCode), 0);
}
function addPreOrder(entry){
  const list = loadPreOrders();
  list.push(entry);
  savePreOrders(list);
  addPreorderStock(entry.itemCode, entry.qty);
}
function removePreOrder(id){
  const entry = loadPreOrders().find(p => p.id === id);
  if(entry){
    setPreorderStock(entry.itemCode, getPreorderStock(entry.itemCode) - entry.qty);
  }
  const list = loadPreOrders().filter(p => p.id !== id);
  savePreOrders(list);
}
function stockedCategoryList(){
  return CATEGORY_ORDER.filter(cat => ITEMS.some(it => it.category === cat));
}
const PREORDERS_KEY = 'Pre-orders';
function requiredConfirmationKeys(){
  return [...stockedCategoryList(), PREORDERS_KEY];
}
function allCategoriesConfirmed(){
  const keys = requiredConfirmationKeys();
  return keys.length > 0 && keys.every(isCategoryConfirmed);
}
function isFlightOpen(){
  if(!flightDetailsComplete()) return false;
  return allCategoriesConfirmed();
}

/* ---------- Cart storage ---------- */
let cart = [];
function loadCart(){
  try{
    const raw = localStorage.getItem('cart_state');
    cart = raw ? JSON.parse(raw) : [];
    cart.forEach(c => {
      if(c.crewStaffNo === undefined) c.crewStaffNo = '';
      if(c.crewStaffName === undefined) c.crewStaffName = '';
      if(!c.id) c.id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    });
  } catch(e){ cart = []; }
}
function saveCart(){
  try{ localStorage.setItem('cart_state', JSON.stringify(cart)); } catch(e){}
}
function cartQtyFor(itemCode){
  return cart.filter(c => c.itemCode === itemCode && !c.fromPreorder).reduce((s,c)=>s+c.qty,0);
}
function availableStock(itemCode){
  const stock = getStock(itemCode);
  return Math.max(0, stock - cartQtyFor(itemCode));
}
function addToCart(it, qty, unitPrice, priceLabel, forceNewLine, fromPreorder){
  const existing = !forceNewLine ? cart.find(c => c.itemCode === it.itemCode && c.priceLabel === priceLabel) : null;
  if(existing){ existing.qty += qty; }
  else{
    cart.push({
      id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      itemCode: it.itemCode, itemNo: it.itemNo, name: it.name, category: it.category,
      unitPrice, priceLabel, qty, crewStaffNo: '', crewStaffName: '',
      fromPreorder: !!fromPreorder
    });
  }
  saveCart();
}
function setCartQty(id, qty){
  const entry = cart.find(c => c.id === id);
  if(!entry) return;
  if(entry.fromPreorder){
    const delta = qty - entry.qty; // positive = drawing more from the pool, negative = restoring to it
    if(delta > 0){
      const avail = getPreorderStock(entry.itemCode);
      if(delta > avail){
        showToast('No more pre-order stock available for this item');
        qty = entry.qty + avail;
        setPreorderStock(entry.itemCode, 0);
      } else {
        setPreorderStock(entry.itemCode, avail - delta);
      }
    } else if(delta < 0){
      addPreorderStock(entry.itemCode, -delta);
    }
  }
  if(qty <= 0){
    if(entry.fromPreorder) addPreorderStock(entry.itemCode, entry.qty);
    cart = cart.filter(c => c !== entry);
  } else{
    entry.qty = qty;
  }
  saveCart();
}
function removeFromCart(id){
  const entry = cart.find(c => c.id === id);
  if(entry && entry.fromPreorder){
    addPreorderStock(entry.itemCode, entry.qty);
  }
  cart = cart.filter(c => c.id !== id);
  saveCart();
}
function cartTotal(){
  return cart.reduce((s,c)=>s + c.qty * c.unitPrice, 0);
}
function cartCount(){
  return cart.reduce((s,c)=>s+c.qty,0);
}
function cartTransactionType(){
  if(cart.length === 0) return null;
  return isPassengerLabel(cart[0].priceLabel) ? 'passenger' : 'crew';
}

function updateDateTimeBar(){
  const bar = document.getElementById('datetimeBar');
  if(!bar) return;
  const now = new Date();
  const datePart = now.toLocaleDateString(undefined, { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  const timePart = now.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  let tzPart = '';
  try{
    const parts = new Intl.DateTimeFormat(undefined, { timeZoneName:'short' }).formatToParts(now);
    const found = parts.find(p => p.type === 'timeZoneName');
    tzPart = found ? found.value : '';
  } catch(e){ /* fall through */ }
  if(!tzPart){
    try{ tzPart = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){ tzPart = ''; }
  }
  const timePartHtml = escapeHtml(timePart).replace(':', '<span class="clock-colon">:</span>');
  bar.innerHTML = `${escapeHtml(datePart)} · <span class="datetime-time">${timePartHtml}</span>${tzPart ? ' (' + escapeHtml(tzPart) + ')' : ''}`;
}

/* ---------- Sales log (records what's actually sold, for the Session Summary) ---------- */
function loadSalesLog(){
  try{ return JSON.parse(localStorage.getItem('sales_log') || '[]'); } catch(e){ return []; }
}
function saveSalesLog(log){
  try{ localStorage.setItem('sales_log', JSON.stringify(log)); } catch(e){}
}
function recordSale(cartEntries){
  const log = loadSalesLog();
  const ts = Date.now();
  cartEntries.forEach(c => {
    log.push({
      itemCode: c.itemCode, itemNo: c.itemNo, name: c.name, category: c.category,
      priceLabel: c.priceLabel, unitPrice: c.unitPrice, qty: c.qty,
      lineTotal: c.qty * c.unitPrice, timestamp: ts,
      crewStaffNo: c.crewStaffNo || '', crewStaffName: c.crewStaffName || '',
      fromPreorder: !!c.fromPreorder
    });
  });
  saveSalesLog(log);
}
function isPassengerLabel(label){ return label === 'Listed' || label === 'Special'; }
function summarizeLog(log){
  const map = {};
  log.forEach(l => {
    const staffKey = l.priceLabel === 'Crew' ? (l.crewStaffNo || '') + '|' + (l.crewStaffName || '') : '';
    const preKey = l.fromPreorder ? 'pre' : 'reg';
    const key = l.itemCode + '|' + l.priceLabel + '|' + staffKey + '|' + preKey;
    if(!map[key]){
      map[key] = {
        itemCode:l.itemCode, name:l.name, priceLabel:l.priceLabel, unitPrice:l.unitPrice, qty:0, lineTotal:0,
        crewStaffNo: l.crewStaffNo || '', crewStaffName: l.crewStaffName || '',
        fromPreorder: !!l.fromPreorder
      };
    }
    map[key].qty += l.qty;
    map[key].lineTotal += l.lineTotal;
  });
  return Object.values(map);
}
function buildStockReportRows(log){
  const soldByCode = {};
  log.forEach(l => {
    if(l.fromPreorder) return; // pre-order sales are tracked separately, not against regular opening stock
    soldByCode[l.itemCode] = (soldByCode[l.itemCode] || 0) + l.qty;
  });
  return ITEMS
    .map(it => {
      const opening = getOpeningStockSnapshot(it.itemCode);
      const closing = getStock(it.itemCode);
      const sold = soldByCode[it.itemCode] || 0;
      if(opening === 0 && closing === 0 && sold === 0) return null;
      return {
        itemNo: it.itemNo, name: it.name, itemCode: it.itemCode, category: it.category,
        opening, sold, closing
      };
    })
    .filter(Boolean)
    .sort((a,b) => a.itemNo - b.itemNo);
}
function buildPreorderStockReportRows(log){
  const soldByCode = {};
  log.forEach(l => {
    if(!l.fromPreorder) return;
    soldByCode[l.itemCode] = (soldByCode[l.itemCode] || 0) + l.qty;
  });
  return ITEMS
    .map(it => {
      const closing = getPreorderStock(it.itemCode);
      const sold = soldByCode[it.itemCode] || 0;
      const opening = closing + sold; // derived, so Opening = Sold + Closing always holds exactly
      if(opening === 0) return null;
      return {
        itemNo: it.itemNo, name: it.name, itemCode: it.itemCode, category: it.category,
        opening, sold, closing
      };
    })
    .filter(Boolean)
    .sort((a,b) => a.itemNo - b.itemNo);
}
function loadSessionsHistory(){
  try{ return JSON.parse(localStorage.getItem('sales_sessions') || '[]'); } catch(e){ return []; }
}
function saveSessionsHistory(list){
  try{ localStorage.setItem('sales_sessions', JSON.stringify(list)); } catch(e){}
}

function loadPaymentsLog(){
  try{ return JSON.parse(localStorage.getItem('payments_log') || '[]'); } catch(e){ return []; }
}
function savePaymentsLog(list){
  try{ localStorage.setItem('payments_log', JSON.stringify(list)); } catch(e){}
}
function recordPayment(info){
  const log = loadPaymentsLog();
  log.push(info);
  savePaymentsLog(log);
}
function getCurrencyRate(code){
  if(code === 'USD') return 1;
  const r = CONVERSION_RATES.rates.find(r => r.code === code);
  return r ? r.rate : null;
}
function paymentLinesTotalUSD(){
  return state.paymentLines.reduce((s,l) => s + l.amountUSD, 0);
}
function goToPayment(){
  if(cart.length === 0) return;
  if(cartTransactionType() === 'crew'){
    const missing = cart.some(c => !(c.crewStaffNo && c.crewStaffNo.trim()) || !(c.crewStaffName && c.crewStaffName.trim()));
    if(missing){
      showToast('Enter Staff No and Name for every item before completing a staff sale');
      document.querySelectorAll('.crew-staff-input').forEach(inp => {
        if(!inp.value.trim()) inp.classList.add('missing');
      });
      return;
    }
  }
  state.paymentMethod = null;
  state.paymentLines = [];
  state.view = 'payment';
  window.scrollTo(0,0);
  render();
}
function finalizeSale(){
  const due = saleDueTotal(state.paymentMethod);
  cart.forEach(c => {
    if(c.fromPreorder) return; // pre-order sales don't touch regular opening stock
    const stock = getStock(c.itemCode);
    setStock(c.itemCode, Math.max(0, stock - c.qty));
  });
  // A 100%-Cash sale applies the per-unit cash discount to the recorded
  // unit price itself (for eligible passenger lines), so the sales log,
  // Session Summary and reports all reflect what was actually charged —
  // not just the payment-screen total.
  const saleEntries = state.paymentMethod === 'cash'
    ? cart.map(c => (isPassengerLabel(c.priceLabel) && CASH_DISCOUNT_ITEMS.has(c.itemNo))
        ? { ...c, unitPrice: Math.max(0, c.unitPrice - CASH_DISCOUNT_USD) }
        : c)
    : cart;
  recordSale(saleEntries);
  recordPayment({
    timestamp: Date.now(), total: due,
    method: state.paymentMethod,
    lines: state.paymentLines
  });
  cart = [];
  saveCart();
  showToast(`Sale completed — ${fmt(due)}`);
  updateCartBadge();
  state.paymentMethod = null;
  state.paymentLines = [];
  state.view = 'home';
  window.scrollTo(0,0);
  render();
}

function catCounts(){
  const map = {};
  ITEMS.forEach(it => { map[it.category] = (map[it.category]||0) + 1; });
  return map;
}

function fmt(n){
  return '$' + Number(n).toFixed(0);
}

   it to "Staff" wherever it's actually shown to the user. */

let preorderCartDrafts = {};

  let html = `

    <div class="list-count">${pending.length === 0 ? 'No pending pre-orders' : `${pending.length} item${pending.length===1?'':'s'} pending — confirm quantity and price, then send to the cart`}</div>
  `;

  if(pending.length === 0){
    html += '<div class="empty-state">Pre-orders recorded on the Open Flight page will appear here, ready to price and send to the cart.</div>';
  } else {
    html += pending.map(it => {
      const balance = getPreorderStock(it.itemCode);
      if(!preorderCartDrafts[it.itemCode]){
        preorderCartDrafts[it.itemCode] = { unitPrice: String(it.listedPrice), qty: String(balance), staffSale: false };
      }
      const draft = preorderCartDrafts[it.itemCode];
      return `
        <div class="preorder-cart-row" data-code="${escapeAttr(it.itemCode)}">
          <div class="item-name">${escapeHtml(it.name)}</div>

            <div class="flight-field">
              <label class="flight-label">Quantity to Sell</label>
              <input type="number" class="flight-input preorder-cart-qty" inputmode="numeric" min="1" max="${balance}" step="1" value="${escapeAttr(draft.qty)}">
            </div>
            <div class="flight-field">
              <label class="flight-label">Unit Price</label>
              <input type="number" class="flight-input preorder-cart-price" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${escapeAttr(draft.unitPrice)}">
            </div>
            <div class="flight-field" style="flex-basis:100%;">
              <label class="flight-label">Total</label>
              <div class="preorder-total-display mono preorder-cart-total">${fmt((parseFloat(draft.unitPrice)||0) * (parseInt(draft.qty,10)||0))}</div>
            </div>
          </div>
          <label class="preorder-staff-check" style="margin-top:10px;">
            <input type="checkbox" class="preorder-cart-staff" ${draft.staffSale ? 'checked' : ''}>
            <span>Staff Sale <span class="preorder-staff-hint">(excluded from incentive calculations)</span></span>
          </label>
          <button class="add-cart-btn preorder-send-btn" type="button" style="margin-top:10px;">Send to Cart</button>
        </div>
      `;
    }).join('');
  }

  html += floatingHomeBarHtml();
  main.innerHTML = html;
  wireFloatingHomeBar();

  main.querySelectorAll('.preorder-cart-row').forEach(row => {
    const itemCode = row.dataset.code;
    const draft = preorderCartDrafts[itemCode];
    const qtyInput = row.querySelector('.preorder-cart-qty');
    const priceInput = row.querySelector('.preorder-cart-price');
    const totalDisplay = row.querySelector('.preorder-cart-total');
    const staffCheck = row.querySelector('.preorder-cart-staff');
    const it = ITEMS.find(i => i.itemCode === itemCode);

    function recalcTotal(){
      totalDisplay.textContent = fmt((parseFloat(draft.unitPrice)||0) * (parseInt(draft.qty,10)||0));
    }
    qtyInput.addEventListener('input', () => {
      draft.qty = qtyInput.value;
      recalcTotal();
    });
    priceInput.addEventListener('input', () => {
      draft.unitPrice = priceInput.value;
      recalcTotal();
    });
    staffCheck.addEventListener('change', () => {
      draft.staffSale = staffCheck.checked;
    });

    row.querySelector('.preorder-send-btn').addEventListener('click', () => {
      const price = parseFloat(draft.unitPrice) || 0;
      const qty = parseInt(draft.qty, 10) || 0;
      const balance = getPreorderStock(itemCode);
      if(qty <= 0){
        showToast('Enter a quantity of at least 1');
        return;
      }
      if(qty > balance){
        showToast(`Only ${balance} left in the pre-order balance for this item`);
        return;
      }
      if(price <= 0){
        showToast('Enter a unit price greater than 0');
        return;
      }
      if(!it){
        showToast('This item is no longer in the catalog');
        return;
      }
      const priceLabel = draft.staffSale ? 'Crew' : 'Listed';
      const newType = isPassengerLabel(priceLabel) ? 'passenger' : 'crew';
      const existingType = cartTransactionType();
      if(existingType && existingType !== newType){
        showToast(`Cart already has ${existingType === 'crew' ? 'staff' : existingType} sales — clear or complete it before adding ${newType === 'crew' ? 'staff' : newType} sales.`);
        return;
      }
      setPreorderStock(itemCode, balance - qty);
      addToCart(it, qty, price, priceLabel, true, true);
      delete preorderCartDrafts[itemCode];
      updateCartBadge();
      showToast(`${it.name} sent to cart`);
      renderPreOrdersCart(main);
    });
  });
}

function renderCart(main){

    main.innerHTML = `

        </div>` : ''}
      </div>
      <div class="item-price">
        <div class="amt">${fmt(c.qty * c.unitPrice)}</div>
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="list-title">Cart</div>
    <div class="list-count">${cart.length} line item${cart.length===1?'':'s'} · ${cartCount()} unit${cartCount()===1?'':'s'}</div>
    ${isCrewCart ? '<div class="stock-note" style="margin:0 0 4px;">Staff sale — enter the Staff No and Name for each item before completing the sale.</div>' : ''}
    ${rowsHtml}
    <div class="cart-footer">
      <div class="cart-total-line"><span>Total</span><span class="mono">${fmt(cartTotal())}</span></div>
      <button class="add-cart-btn" id="completeSaleBtn" type="button">Complete Sale</button>
      <button class="clear-cart-btn" id="clearCartBtn" type="button">Clear Cart</button>
    </div>
    ${floatingHomeBarHtml()}
  `;

  main.querySelectorAll('.crew-staff-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const start = inp.selectionStart;
      const end = inp.selectionEnd;
      const before = inp.value;
      if(inp.classList.contains('staff-no-input')){
        inp.value = inp.value.replace(/[^0-9]/g, '');
      } else if(inp.classList.contains('staff-name-input')){
        inp.value = inp.value.toUpperCase();
      }
      if(inp.value !== before){
        const shift = inp.value.length - before.length;
        inp.setSelectionRange(Math.max(0, start + shift), Math.max(0, end + shift));
      }
      const row = inp.closest('.cart-row');
      const entry = cart.find(c => c.id === row.dataset.id);
      if(entry){
        entry[inp.dataset.field] = inp.value;
        saveCart();
      }
      if(inp.value.trim()) inp.classList.remove('missing');
    });
  });

  main.querySelectorAll('.cart-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const entry = cart.find(c => c.id === id);
        if(!entry) return;
        const delta = btn.dataset.action === 'inc' ? 1 : -1;
        const newQty = entry.qty + delta;
        if(delta > 0 && !entry.fromPreorder){
          const stock = getStock(entry.itemCode);
          const otherQty = cartQtyFor(entry.itemCode) - entry.qty;
          if(newQty > (stock - otherQty)){ showToast('No more stock available'); return; }
        }
        setCartQty(id, newQty);
        renderCart(main);
        updateCartBadge();
      });
    });
    row.querySelector('.cart-remove').addEventListener('click', () => {
      removeFromCart(id);
      renderCart(main);
      updateCartBadge();
    });
  });

  document.getElementById('clearCartBtn').addEventListener('click', () => {
    showConfirm('Clear all items from the cart?', () => {
      cart.forEach(c => { if(c.fromPreorder) addPreorderStock(c.itemCode, c.qty); });
      cart = []; saveCart(); renderCart(main); updateCartBadge();
    });
  });
  document.getElementById('completeSaleBtn').addEventListener('click', goToPayment);
  wireFloatingHomeBar();
}

/* ---------- Printable flight report ---------- */
function computeSummaryTotals(log){
  const summary = summarizeLog(log);
  const passengerItems = summary.filter(s => isPassengerLabel(s.priceLabel) && !s.fromPreorder).sort((a,b)=>a.name.localeCompare(b.name));
  const crewItems = summary.filter(s => s.priceLabel === 'Crew' && !s.fromPreorder).sort((a,b)=>a.name.localeCompare(b.name));
  const preorderPassengerItems = summary.filter(s => isPassengerLabel(s.priceLabel) && s.fromPreorder).sort((a,b)=>a.name.localeCompare(b.name));
  const preorderCrewItems = summary.filter(s => s.priceLabel === 'Crew' && s.fromPreorder).sort((a,b)=>a.name.localeCompare(b.name));
  const passengerTotal = passengerItems.reduce((s,i)=>s+i.lineTotal,0);
  const crewTotal = crewItems.reduce((s,i)=>s+i.lineTotal,0);
  const preorderPassengerTotal = preorderPassengerItems.reduce((s,i)=>s+i.lineTotal,0);
  const preorderCrewTotal = preorderCrewItems.reduce((s,i)=>s+i.lineTotal,0);
  return {
    passengerItems, crewItems, preorderPassengerItems, preorderCrewItems,
    passengerTotal, crewTotal, preorderPassengerTotal, preorderCrewTotal,
    grandTotal: passengerTotal + crewTotal + preorderPassengerTotal + preorderCrewTotal
  };
}

function summarizePayments(payments){
  let cardUSD = 0, voucherUSD = 0;
  const cashByCurrency = {};
  (payments || []).forEach(p => {
    (p.lines || []).forEach(l => {
      if(l.method === 'card'){
        cardUSD += l.amountUSD;
      } else if(l.method === 'voucher'){
        voucherUSD += l.amountUSD;
      } else if(l.method === 'cash'){
        const cur = l.currency || 'USD';
        if(!cashByCurrency[cur]) cashByCurrency[cur] = { foreign: 0, usd: 0 };
        cashByCurrency[cur].foreign += l.amountForeign;
        cashByCurrency[cur].usd += l.amountUSD;
      }
    });
  });
  const cashUSD = Object.values(cashByCurrency).reduce((s,c) => s + c.usd, 0);
  return { cardUSD, voucherUSD, cashByCurrency, cashUSD, totalUSD: cardUSD + voucherUSD + cashUSD };
}

function buildReportHtml(meta, log, stockRows, payments, preorderStockRows){
  const {
    passengerItems, crewItems, preorderPassengerItems, preorderCrewItems,
    passengerTotal, crewTotal, preorderPassengerTotal, preorderCrewTotal, grandTotal
  } = computeSummaryTotals(log);
  const paySummary = summarizePayments(payments);
  const incentiveEligibleUSD = passengerTotal + preorderPassengerTotal;
  const incentiveRate = 0.05;
  const incentiveUSD = incentiveEligibleUSD * incentiveRate;
  const incentiveLKRRate = (CONVERSION_RATES && CONVERSION_RATES.incentiveRateLKR) || 0;
  const incentiveLKR = incentiveUSD * incentiveLKRRate;

  function salesRows(items){
    if(items.length === 0) return '<tr><td colspan="5" class="rpt-empty">No items in this section.</td></tr>';
    return items.map(i => `
      <tr>
        <td>${escapeHtml(i.name)}</td>

        <td class="num">${fmt(i.unitPrice)}</td>

  function crewSalesRows(items){

      <tr>
        <td>${escapeHtml(i.name)}</td>

        <td class="num">${r.sold}</td>
        <td class="num">${r.closing}</td>

  const preorderStockRowsHtml = !preorderStockRows || preorderStockRows.length === 0
    ? '<tr><td colspan="6" class="rpt-empty">No pre-order stock recorded for this flight.</td></tr>'
    : preorderStockRows.map(r => `
      <tr>
        <td>${String(r.itemNo).padStart(2,'0')}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.itemCode)}</td>
        <td class="num">${r.opening}</td>
        <td class="num">${r.sold}</td>

  const now = new Date();
  return `

      <div class="rpt-subtitle">SriLankan Airlines · Inflight Duty-Free</div>
      <table class="rpt-meta">
        <tr><td class="rpt-label">Flight Number</td><td>${escapeHtml(meta.flightNumber || '—')}</td></tr>
        <tr><td class="rpt-label">Date</td><td>${escapeHtml(meta.flightDate || '—')}</td></tr>
        <tr><td class="rpt-label">Sector</td><td>${escapeHtml(meta.sector || '—')}</td></tr>
        <tr><td class="rpt-label">CSS Staff No</td><td>${escapeHtml(meta.staffNo || '—')}</td></tr>
        <tr><td class="rpt-label">CSS Name</td><td>${escapeHtml(meta.staffName || '—')}</td></tr>
        ${meta.closedAt ? `<tr><td class="rpt-label">Flight closed</td><td>${new Date(meta.closedAt).toLocaleString()}</td></tr>` : ''}
        <tr><td class="rpt-label">Report generated</td><td>${now.toLocaleString()}</td></tr>
      </table>

      <div class="rpt-section-title">Normal Sales to Passengers</div>
      <table class="rpt-table">
        <tr><th>Item</th><th>Code / Tier</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr>
        ${salesRows(passengerItems)}
        <tr class="rpt-subtotal-row"><td colspan="4">Subtotal</td><td class="num">${fmt(passengerTotal)}</td></tr>
      </table>

      <div class="rpt-section-title">Normal Sales to Staff</div>
      <table class="rpt-table">
        <tr><th>Item</th><th>Code</th><th>Staff No / Name</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr>
        ${crewSalesRows(crewItems)}
        <tr class="rpt-subtotal-row"><td colspan="5">Subtotal</td><td class="num">${fmt(crewTotal)}</td></tr>
      </table>

      <div class="rpt-section-title">Pre-order to Passengers</div>
      <table class="rpt-table">
        <tr><th>Item</th><th>Code / Tier</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr>
        ${salesRows(preorderPassengerItems)}
        <tr class="rpt-subtotal-row"><td colspan="4">Subtotal</td><td class="num">${fmt(preorderPassengerTotal)}</td></tr>
      </table>

      <div class="rpt-section-title">Pre-orders to Staff</div>
      <table class="rpt-table">
        <tr><th>Item</th><th>Code</th><th>Staff No / Name</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr>
        ${crewSalesRows(preorderCrewItems)}
        <tr class="rpt-subtotal-row"><td colspan="5">Subtotal</td><td class="num">${fmt(preorderCrewTotal)}</td></tr>
      </table>

      <div class="rpt-grand-total"><span>Grand Total</span><span>${fmt(grandTotal)}</span></div>

      <div class="rpt-section-title">Payment Summary</div>

        <tr><th>Method</th><th class="num">Amount</th></tr>
        ${paySummary.totalUSD === 0
          ? '<tr><td colspan="2" class="rpt-empty">No payments recorded for this flight.</td></tr>'
          : `
            ${paySummary.cardUSD > 0 ? `<tr><td>Credit Card</td><td class="num">${fmt(paySummary.cardUSD)}</td></tr>` : ''}
            ${paySummary.voucherUSD > 0 ? `<tr><td>Onboard Vouchers</td><td class="num">${fmt(paySummary.voucherUSD)}</td></tr>` : ''}
            ${Object.keys(paySummary.cashByCurrency).sort().map(cur => {
              const c = paySummary.cashByCurrency[cur];
              return `<tr><td>Cash — ${escapeHtml(cur)}</td><td class="num">${cur === 'USD' ? fmt(c.foreign) : `${c.foreign.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} ${escapeHtml(cur)} (${fmt(c.usd)})`}</td></tr>`;
